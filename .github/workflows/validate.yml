name: Marketplace validation
on:
  # Bot-created PRs need this explicit exact-branch route (see protected-main.md).
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # This display name is the required main-protection context.
    name: Marketplace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - name: Validate marketplace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/validate-marketplace.py
