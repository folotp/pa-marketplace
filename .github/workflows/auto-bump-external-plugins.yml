name: Auto-bump external plugins

on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [external-plugin-release]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-bump-external-plugins
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run bumper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/bump-external-plugins.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        if: steps.diff.outputs.changed == 'true'
        id: validate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/validate-marketplace.py

      - name: Open or update bump pull request
        if: steps.diff.outputs.changed == 'true' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'marketplace-bot'
          git config user.email 'noreply@github.com'
          # Deterministic branch; serialize runs and preserve normal PR review.
          branch="chore/auto-bump-external-plugins"
          mkdir -p /tmp/marketplace-bump/.claude-plugin /tmp/marketplace-bump/.agents/plugins
          cp .claude-plugin/marketplace.json /tmp/marketplace-bump/.claude-plugin/
          cp .agents/plugins/marketplace.json /tmp/marketplace-bump/.agents/plugins/
          cp README.md /tmp/marketplace-bump/
          git restore .claude-plugin/marketplace.json .agents/plugins/marketplace.json README.md
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git switch -c "$branch"
          fi
          cp /tmp/marketplace-bump/.claude-plugin/marketplace.json .claude-plugin/
          cp /tmp/marketplace-bump/.agents/plugins/marketplace.json .agents/plugins/
          cp /tmp/marketplace-bump/README.md .
          python3 scripts/validate-marketplace.py
          git add .claude-plugin/marketplace.json .agents/plugins/marketplace.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(marketplace): auto-bump external plugins"
          fi
          # Publish merge-only refreshes too, so strict main protection can pass.
          git push origin "$branch"
          if [[ "$(gh pr list --state open --head "$branch" --json number --jq length)" == 0 ]]; then
            gh pr create --base main --head "$branch" \
              --title "chore(marketplace): auto-bump external plugins" \
              --body "Validated external plugin pins. Generated by the auto-bump workflow; merge through the protected-main PR gate."
          fi

          # GITHUB_TOKEN PRs do not trigger pull_request workflows. A dispatch
          # runs validation on this exact branch commit and supplies its check.
          gh workflow run validate.yml --ref "$branch"

      - name: Open issue on validation failure
        if: steps.diff.outputs.changed == 'true' && steps.validate.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'The auto-bump workflow produced a diff that failed validation. The diff was NOT committed.'
            echo
            echo '## Diff'
            echo
            echo '```diff'
            git diff
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "Auto-bump validation failed on $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body-file /tmp/issue-body.md
